<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Downloads</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 2rem;
        }

        .error {
            background: rgba(255,100,100,0.2);
            color: white;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .config-section {
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .config-section input {
            padding: 0.5rem;
            border-radius: 4px;
            border: none;
            margin-right: 0.5rem;
            font-size: 1rem;
        }

        .config-section button {
            padding: 0.5rem 1rem;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .config-section button:hover {
            opacity: 0.9;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .app-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .app-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .app-version {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .app-description {
            color: #555;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .download-btn:hover {
            opacity: 0.9;
        }

        .last-updated {
            color: #888;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 2rem;
            opacity: 0.8;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 My Apps - APK Downloads</h1>

        <!-- Configuration Section -->
        <div class="config-section" id="configSection">
            <strong>Setup:</strong> Enter your GitHub username and repository name
            <div style="margin-top: 1rem;">
                <input type="text" id="githubUsername" placeholder="GitHub username" value="bramistoek-crypto">
                <input type="text" id="repoName" placeholder="Repository name" value="apk-downloads">
                <button onclick="loadApps()">Load Apps</button>
            </div>
            <p style="margin-top: 0.5rem; font-size: 0.85rem; opacity: 0.8;">
                After setup, you can hardcode these values in the script below and remove this section.
            </p>
        </div>

        <div id="loading" class="loading">Loading apps...</div>
        <div id="error" class="error hidden"></div>

        <div class="apps-grid" id="appsGrid"></div>

        <div class="footer">
            <p>Download the latest APK files for your applications</p>
        </div>
    </div>

    <script>
        // CONFIGURATION - Hardcode these after setup and remove the config section above
        let GITHUB_USERNAME = 'bramistoek-crypto';
        let REPO_NAME = 'apk-downloads';

        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const appsGrid = document.getElementById('appsGrid');
        const configSection = document.getElementById('configSection');

        // Load config from URL parameters if available
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('username')) GITHUB_USERNAME = urlParams.get('username');
        if (urlParams.get('repo')) REPO_NAME = urlParams.get('repo');

        async function loadApps() {
            const usernameInput = document.getElementById('githubUsername').value;
            const repoInput = document.getElementById('repoName').value;

            if (usernameInput && usernameInput !== 'YOUR_USERNAME') {
                GITHUB_USERNAME = usernameInput;
            }
            if (repoInput) {
                REPO_NAME = repoInput;
            }

            loading.classList.remove('hidden');
            error.classList.add('hidden');
            appsGrid.innerHTML = '';

            try {
                // Fetch repository contents from GitHub API
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents`);
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch repository: ${response.status}`);
                }

                const files = await response.json();
                
                // Filter for APK files
                const apkFiles = files.filter(file => file.name.endsWith('.apk'));

                if (apkFiles.length === 0) {
                    throw new Error('No APK files found in the repository');
                }

                // Display each APK
                for (const file of apkFiles) {
                    const appInfo = parseApkFilename(file.name);
                    const downloadUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${REPO_NAME}/main/${file.name}`;
                    
                    const card = document.createElement('div');
                    card.className = 'app-card';
                    card.innerHTML = `
                        <div class="app-name">${appInfo.name}</div>
                        <div class="app-version">Version: ${appInfo.version}</div>
                        <div class="app-description">${appInfo.description}</div>
                        <a href="${downloadUrl}" class="download-btn" download>Download APK</a>
                        <div class="last-updated">File: ${file.name}</div>
                    `;
                    appsGrid.appendChild(card);
                }

                loading.classList.add('hidden');

            } catch (err) {
                loading.classList.add('hidden');
                error.classList.remove('hidden');
                error.textContent = `Error: ${err.message}. Make sure the repository is public and the username/repo are correct.`;
            }
        }

        function parseApkFilename(filename) {
            // Try to extract version from filename
            // Expected formats: appname-v1.0.0.apk, appname-1.0.0.apk, appname.apk
            const baseName = filename.replace('.apk', '');
            
            let name = baseName;
            let version = 'Unknown';
            let description = 'Android application';

            // Try to match version patterns
            const versionMatch = baseName.match(/[-_](\d+\.\d+\.\d+)/) || 
                               baseName.match(/[-_](\d+\.\d+)/) ||
                               baseName.match(/[-_]v(\d+\.\d+\.\d+)/) ||
                               baseName.match(/[-_]v(\d+\.\d+)/);

            if (versionMatch) {
                version = versionMatch[1];
                name = baseName.split(versionMatch[0])[0].replace(/[-_]$/, '');
            }

            // Clean up the name
            name = name.replace(/[-_]/g, ' ');
            name = name.charAt(0).toUpperCase() + name.slice(1);

            // Generate description based on name
            if (name.toLowerCase().includes('chat')) {
                description = 'Messaging application for real-time communication';
            } else if (name.toLowerCase().includes('storage') || name.toLowerCase().includes('cloud')) {
                description = 'Cloud storage solution for your files';
            } else if (name.toLowerCase().includes('os') || name.toLowerCase().includes('system')) {
                description = 'Operating system application';
            }

            return { name, version, description };
        }

        // Auto-load on page if config is set
        if (GITHUB_USERNAME !== 'YOUR_USERNAME' && GITHUB_USERNAME !== '') {
            configSection.classList.add('hidden');
            loadApps();
        }
    </script>
</body>
</html>
